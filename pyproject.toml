[project]
name = "minimaxh3"
version = "0.1.0"
description = "A standalone local MiniMax H3 CUDA video generation API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
removal = [
    "hydra-core>=1.3,<2",
    "iopath>=0.1.10,<0.2",
    "imageio>=2.37,<3",
    "imageio-ffmpeg>=0.6,<1",
    "addict>=2.4,<3",
    "timm>=1,<2",
    "scikit-image>=0.25,<1",
    "yapf>=0.43,<1",
    "future>=1,<2",
]
ui = [
    "gradio>=6,<7",
]
dev = [
    "pytest>=8.4,<9",
]
local = [
    "av>=16,<17",
    "blake3>=1,<2",
    "comfy-aimdo==0.4.13",
    "comfy-angle>=0.1,<1",
    "comfy-kitchen==0.2.28",
    "diffusers>=0.33.1,<1",
    "einops>=0.8,<1",
    "filelock>=3.18,<4",
    "gguf>=0.19,<1",
    "huggingface-hub>=0.34,<2",
    "kornia>=0.8,<1",
    "matplotlib>=3.10,<4",
    "numpy>=1.26,<3",
    "omegaconf>=2.3,<3",
    "opencv-python>=4.11,<5",
    "peft>=0.17,<1",
    "Pillow>=11,<13",
    "psutil>=7,<8",
    "PyYAML>=6,<7",
    "requests>=2.32,<3",
    "rotary-embedding-torch>=0.5,<1",
    "safetensors>=0.6,<1",
    "scipy>=1.15,<2",
    "sentencepiece>=0.2,<1",
    "simpleeval>=1,<2",
    "spandrel>=0.4,<1",
    "tokenizers>=0.21,<1",
    "torch>=2.8,<2.9",
    "torchaudio>=2.8,<2.9",
    "torchsde>=0.2.6,<1",
    "torchvision>=0.23,<0.24",
    "tqdm>=4.67,<5",
    "transformers>=4.50.3,<6",
]

[project.scripts]
minimaxh3 = "minimaxh3_service.__main__:main"
minimaxh3-setup = "minimaxh3_service.setup_local:main"
minimaxh3-openapi = "minimaxh3_service.export_openapi:main"
minimaxh3-ui = "minimaxh3_service.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minimaxh3_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
