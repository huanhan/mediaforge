<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>素材采集助手</title><style>
body{font:13px/1.7 system-ui;width:300px;padding:18px;color:#302938}h2{margin:0 0 8px;font-size:16px}
button{box-sizing:border-box;width:100%;padding:9px;border:1px solid #7955db;border-radius:7px;background:#7955db;color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}button.secondary{background:#fff;color:#7955db}
#status{white-space:pre-wrap;margin:8px 0 14px;min-height:2.6em;overflow-wrap:anywhere;color:#534a5c}#status.ok{color:#2d7653;font-weight:600}#status.err{color:#b3261e;font-weight:600}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body><h2>素材采集助手</h2><p id="status" role="status" aria-live="polite"></p><div class="buttons"><button id="check" class="secondary">测试连接</button><button id="toggle">开启</button></div><script src="popup.js"></script></body></html>
